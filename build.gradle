plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.saps.dev/releases' }
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://maven.blamejared.com' } // JEI
}

base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = '2024.11.17'
        minecraftVersion = '1.21.1'
    }
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations { runtimeClasspath.extendsFrom localRuntime }

dependencies {
    // only for the JEI batching of Chapters' stage locks, JEI itself comes with the pack
    compileOnly "mezz.jei:jei-1.21.1-common-api:${jei_version}"
}

var generatedResources = file("src/generated/resources")

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            neo_version      : neo_version,
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_version      : mod_version,
            mod_authors      : mod_authors,
            mod_description  : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) { expand replaceProperties }
}

idea { module { downloadSources = true; downloadJavadoc = true } }
