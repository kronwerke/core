plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.saps.dev/releases' }
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://maven.blamejared.com' } // JEI
    maven { url = 'https://maven.ftb.dev/releases' }
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = '2024.11.17'
        minecraftVersion = '1.21.1'
    }
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations { runtimeClasspath.extendsFrom localRuntime }

dependencies {
    // only for the JEI batching of Chapters' stage locks, JEI itself comes with the pack
    compileOnly "mezz.jei:jei-1.21.1-common-api:${jei_version}"
    // stage locks: locked items can be carried but not held, see lock/LockedItems; Chapters comes with the pack
    compileOnly "maven.modrinth:chapters:${chapters_version}"
    // the shared network (share/): each mod's layer only loads when the mod is there
    compileOnly "maven.modrinth:mekanism:${mekanism_version}"
    compileOnly "maven.modrinth:ae2:${ae2_version}"
    compileOnly "curse.maven:flux-networks-248020:${flux_file}"
    compileOnly "maven.modrinth:powah:${powah_version}"
    compileOnly "maven.modrinth:functional-storage:${functionalstorage_version}"
    compileOnly("dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}") { transitive = false }
    // FTB's packets go through Architectury's networking
    compileOnly("dev.architectury:architectury-neoforge:${architectury_version}") { transitive = false }
}

var generatedResources = file("src/generated/resources")

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            neo_version      : neo_version,
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_version      : mod_version,
            mod_authors      : mod_authors,
            mod_description  : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) { expand replaceProperties }
}

idea { module { downloadSources = true; downloadJavadoc = true } }
